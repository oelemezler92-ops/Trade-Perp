name: ZEUS Extra Market Data

on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeus-extra-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install websocket-client==1.8.0

      - name: Check Python syntax
        run: python -m py_compile collector.py

      - name: Collect ZEUS market data
        env:
          ZEUS_SYMBOLS: 'BTCUSDT,ICPUSDT,FETUSDT,RAYSOLUSDT'
          ZEUS_MAX_PAGES: '35'
          ZEUS_LIQUIDATION_CAPTURE_SECONDS: '30'
        run: python collector.py

      - name: Save market data and errors
        if: always()
        run: |
          git config user.name "zeus-market-data-bot"
          git config user.email "zeus-market-data-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh ZEUS market data [skip ci]"
            git push
          fi
