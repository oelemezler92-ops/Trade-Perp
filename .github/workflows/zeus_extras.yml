
name: ZEUS Public Liquidations and Scenarios

on:
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: zeus-extras
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: zeus-gate-publish-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python
        run: python -m py_compile zeus_extras.py

      - name: Fetch real public liquidation history and construct explicitly hypothetical scenarios
        run: python zeus_extras.py

      - name: Publish model data and errors
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "zeus-market-data-bot"
          git config user.email "zeus-market-data-bot@users.noreply.github.com"

          mkdir -p /tmp/zeus-extras-publish
          cp -a data/extras/. /tmp/zeus-extras-publish/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data/extras
            cp -a /tmp/zeus-extras-publish/. data/extras/
            git add -A data/extras/

            if git diff --cached --quiet; then
              echo "No changes to publish"
              exit 0
            fi

            git commit -m "data: refresh ZEUS LIQ/SCE [skip ci]"

            if git push origin HEAD:main; then
              echo "ZEUS LIQ/SCE published successfully"
              exit 0
            fi

            echo "Concurrent update, retry $attempt"
            sleep $((attempt * 2))
          done

          echo "::error::ZEUS LIQ/SCE publish failed"
          exit 1
          
