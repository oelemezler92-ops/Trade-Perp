name: ZEUS BTC CVD Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch BTC trade pagination and stale history handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("collector.py")
          src = path.read_text(encoding="utf-8")

          if "def _get_trades_window(" not in src:
              original = "def get_trades(contract: str, start_ms: int, end_ms: int) -> tuple[list[dict], dict]:"
              assert src.count(original) == 1, "Unexpected collector version"
              src = src.replace(original, original.replace("def get_trades(", "def _get_trades_window("), 1)
              wrapper = textwrap.dedent('''
              def get_trades(contract: str, start_ms: int, end_ms: int) -> tuple[list[dict], dict]:
                  """Split BTC time ranges and reject any incomplete trade data."""
                  if contract != "BTC_USDT":
                      return _get_trades_window(contract, start_ms, end_ms)

                  trades = {}
                  total_pages = 0
                  intervals = 0
                  splits = 0

                  def fetch(left: int, right: int) -> None:
                      nonlocal total_pages, splits
                      batch, meta = _get_trades_window(contract, left, right)
                      total_pages += meta["pages"]
                      if not meta["complete_pagination"]:
                          if right - left <= 2000:
                              raise RuntimeError("BTC trade range saturated even at 2 seconds; CVD not published")
                          mid = (left + right) // 2
                          splits += 1
                          fetch(left, mid)
                          fetch(mid, right)
                          return
                      for t in batch:
                          tid = str(t.get("id", ""))
                          if not tid:
                              raise ValueError("BTC trade without ID; cannot deduplicate")
                          trades[tid] = t

                  cursor = start_ms
                  while cursor < end_ms:
                      stop = min(cursor + 60000, end_ms)
                      fetch(cursor, stop)
                      intervals += 1
                      cursor = stop
                  if not intervals:
                      fetch(start_ms, end_ms)
                      intervals = 1

                  return list(trades.values()), {
                      "pages": total_pages,
                      "page_cap_reached": False,
                      "complete_pagination": True,
                      "records": len(trades),
                      "time_slices": intervals,
                      "adaptive_splits": splits,
                  }

              ''')
              marker = "\ndef cvd_bars("
              assert src.count(marker) == 1, "CVD insertion point not found"
              src = src.replace(marker, "\n" + wrapper + marker, 1)

          old_start = "from_ms = (max(0, last_observed - 10_000) if last_observed else at - 6 * 60_000)"
          new_start = "from_ms = (max(at - 6 * 60_000, last_observed - 10_000) if last_observed else at - 6 * 60_000)"
          if old_start in src:
              src = src.replace(old_start, new_start, 1)
          else:
              assert new_start in src, "BTC lookback logic changed"

          old_gap = "gap_before_fetch = bool(last_observed and last_observed < at - WINDOW_MS)"
          new_gap = "gap_before_fetch = bool(last_observed and from_ms > last_observed)"
          if old_gap in src:
              src = src.replace(old_gap, new_gap, 1)
          else:
              assert new_gap in src, "Gap detection logic changed"

          path.write_text(src, encoding="utf-8")
          print("BTC adaptive pagination patch applied")
          PY

      - name: Validate updated collector
        run: python -m py_compile collector.py

      - name: Test actual BTC trade CVD on Gate
        run: |
          python - <<'PY'
          import time
          import collector as c

          now = int(time.time() * 1000)
          info = c.contract_info("BTC_USDT")
          result = c.collect_cvd("BTCUSDT", "BTC_USDT", info, now)
          coverage = result["coverage"]
          assert coverage["complete_pagination"]
          assert coverage["records"] > 0
          assert result["recent_bars_1m"]
          print("BTC LIVE TEST PASSED:", coverage)
          PY

      - name: Commit verified repair and BTC data
        run: |
          git config user.name "zeus-market-data-bot"
          git config user.email "zeus-market-data-bot@users.noreply.github.com"
          git add collector.py data/history/BTCUSDT.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: adaptive BTC CVD pagination and gap detection [skip ci]"
            git pull --rebase
            git push
          fi
          
